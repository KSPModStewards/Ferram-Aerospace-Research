// A submarine's electric propulsion motor for FAR's water tests (crafts/test_sub_big.py), standing in for a
// submarine parts pack's: Firespitter's FS1PRE with a real coastal boat's power (German Type 206: ~500 t submerged,
// one ~1.3 MW motor, 17 kn submerged). About 0.9 MW of thrust power (1.3 MW at ~70% propulsive efficiency): 200 kN up
// to 4.5 m/s, then 900 kN m/s over the speed (Firespitter's velocityLimit, both signs: its forward speed is taken
// along its thrust transform, a pusher's reversed). Its thrust the same whatever its length slider; its looks FS1PRE's.
+PART[FSPROpellerElectric]
{
	@name = FARTestSubMotor
	@title = Submarine propulsion motor (FAR test, FS1PRE)
	@description = FS1PRE with a coastal submarine's power: 200 kN, about 0.9 MW of thrust power.
	@MODULE[FSengine]
	{
		@maxThrust = 200
		@velocityLimit = -15, 0.3;   -12, 0.375;   -10, 0.45;   -8, 0.5625;   -6, 0.75;   -4.5, 1;   4.5, 1;   6, 0.75;   8, 0.5625;   10, 0.45;   12, 0.375;   15, 0.3
	}
	@MODULE[FSpropellerTweak]
	{
		@minThrust = 200
		@maxThrust = 200
	}
}
