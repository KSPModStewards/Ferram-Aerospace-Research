// FAR's rough-water tests (TestWarp.RoughMods): Scatterer's ocean on Kerbin as a player saved it (wind 5, amplitude 2:
// waves a metre and more, enough to wet a floatplane's wing tips), its waves moving craft (oceanCraftWaveInteractions)
@Scatterer_config:NEEDS[Scatterer]:FINAL
{
	%oceanCraftWaveInteractions = True
}
@Scatterer_ocean:NEEDS[Scatterer]:FINAL
{
	@Ocean:HAS[#name[Kerbin]]
	{
		@m_windSpeed = 5
		@AMP = 2
	}
}
