// FAR's water demos and videos (TestWarp.DemoMods): Scatterer's ocean on Kerbin made calm, a light wind (m_windSpeed
// 7 -> 3: Scatterer's wave spectrum grows with the wind's square, the waves about a fifth as high) and few whitecaps,
// and its waves moving craft (oceanCraftWaveInteractions)
@Scatterer_config:NEEDS[Scatterer]:FINAL
{
	%oceanCraftWaveInteractions = True
}
@Scatterer_ocean:NEEDS[Scatterer]:FINAL
{
	@Ocean:HAS[#name[Kerbin]]
	{
		@m_windSpeed = 3
		@m_whiteCapStr = 0.1
		@m_farWhiteCapStr = 0.1
	}
}
