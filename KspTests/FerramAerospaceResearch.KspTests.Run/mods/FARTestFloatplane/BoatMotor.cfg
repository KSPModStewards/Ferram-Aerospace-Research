// An electric boat motor for testing FAR's water forces (KspTests: BoatTests, crafts/test_boat.py). Test-only.
//
// A thrust that does not care whether it is in the water or the air: no intake, no oxygen, its own battery. It thrusts
// as a fixed-pitch propeller roughly does at full power, 10 kN at rest falling linearly to none at 25 m/s (velCurve on
// the Mach number: 25 m/s is Mach 0.0735 in sea-level air), so a run reads as thrust against water and air drag with no
// propeller model in the way. Its Isp only sets its draw: 0.5 s takes ElectricCharge at 2 per second at full thrust
// (a massless propellant: KSP's flow in units is thrust / (Isp g0)); the 5000 in it last 40 minutes.
// Mount it under the hull near the stern on its back (its attach side up, as the Spider sits on a tank's side): it
// pushes along its own +y.
+PART[radialEngineMini_v2]:NEEDS[ferramGraph]
{
	@name = FARTest_BoatMotor
	@title = Electric boat motor (FAR test)
	@description = 10 kN at rest, falling linearly to none at 25 m/s, on its own 5000 ElectricCharge: a boat or submarine's thrust, in the water or out of it, for FAR's water tests.
	@mass = 0.08
	// RP-1 deletes parts without RP0conf (HardRemoveNonRP0)
	%RP0conf = True
	!EFFECTS {}
	!MODULE[ModuleGimbal] {}
	!MODULE[FXModuleLookAtConstraint] {}
	!MODULE[ModuleTestSubject] {}
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 10
		%minThrust = 0
		%exhaustDamage = False
		%useEngineResponseTime = True
		%engineAccelerationSpeed = 2
		%engineDecelerationSpeed = 4
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = ElectricCharge
			ratio = 1
			DrawGauge = True
		}
		@atmosphereCurve
		{
			!key,* = DELETE
			key = 0 0.5
			key = 1 0.5
		}
		%useVelCurve = True
		!velCurve {}
		velCurve
		{
			key = 0 1 -13.6 -13.6
			key = 0.0735 0 -13.6 0
			key = 1 0 0 0
		}
		%useAtmCurve = False
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 5000
		maxAmount = 5000
	}
}

// RO / RP-1 installs: no Kerbalism engine failures on it
@PART[FARTest_BoatMotor]:NEEDS[Kerbalism]:FINAL
{
	!MODULE[Reliability],* {}
	!MODULE[EngineFailures],* {}
}
