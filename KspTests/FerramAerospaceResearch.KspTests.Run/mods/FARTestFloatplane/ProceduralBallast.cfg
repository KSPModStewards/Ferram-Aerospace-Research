// A procedural tank of solid weight, for test hulls whose skin alone is too light (NACA 11-A Shell: a CPP
// Spine of its 2 cm wall weighs ~30 kg as a fuel tank, and could not be towed with the water's 17 kN on it). Its mass is its
// volume (a shell's: its wall's) times dryDensity, in the part itself: ballast in another part left the water's force on
// the light shell, its joint stretching every step.
@PART[proceduralTankLiquid]:AFTER[ProceduralParts]
{
	@MODULE[TankContentSwitcher]
	{
		TANK_TYPE_OPTION
		{
			name = FARTestBallast
			dryDensity = 2.15
			isStructural = true
		}
	}
}
