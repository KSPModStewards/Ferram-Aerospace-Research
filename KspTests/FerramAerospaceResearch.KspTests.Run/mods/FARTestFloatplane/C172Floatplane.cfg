// Cessna 172M floatplane powerplant for FAR's water tests (KspTests: FloatplaneTests). Test-only.
//
// Engine: Lycoming O-320-E2D, 150 hp at 2700 rpm, 320 cu in, 7.0:1, naturally aspirated, direct drive (FAA TCDS 3A12).
// Propeller: McCauley 1A175/ATM8042, two blades, fixed pitch, 80 in diameter, 42 in pitch (seaplane only; TCDS 3A12:
// static rpm at maximum permissible throttle not over 2545, not under 2445 on the 172M). Its Ct/Cp curves: a
// blade-element model (constant face pitch, Clark Y-like section) fitted to JSBSim's prop_75in2f above J 0.6, scaled
// by ct/cp_factor so that full-throttle static rpm falls in the TCDS band (the blade-element static is the weak
// part). Mach effects as JSBSim's for the 172 prop (none below 0.85 tip Mach).

PROPELLER
{
	name = FARTest_McCauley1A175_ATM8042
	ixxFTLB = 2.0
	diameterIN = 80
	numblades = 2
	constspeed = 0
	ct_factor = 0.841
	cp_factor = 0.841
	// blade-element fit (k 1.249, zero-lift -9.77 deg, Clmax 1.80): TCDS 3A12 static rpm, JSBSim 75in2f J >= 0.6
	cThrustFP
	{
		key = 0.00	0.10564
		key = 0.05	0.10289
		key = 0.10	0.09969
		key = 0.15	0.09601
		key = 0.20	0.09180
