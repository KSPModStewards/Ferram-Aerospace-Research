		key = 0.35	0.07623
		key = 0.40	0.07047
		key = 0.45	0.06450
		key = 0.50	0.05834
		key = 0.55	0.05199
		key = 0.60	0.04548
		key = 0.65	0.03882
		key = 0.70	0.03202
		key = 0.75	0.02508
		key = 0.80	0.01802
		key = 0.85	0.01083
		key = 0.90	0.00353
		key = 0.95	-0.00388
		key = 1.00	-0.01140
		key = 1.05	-0.01903
		key = 1.10	-0.02681
		key = 1.15	-0.03403
		key = 1.20	-0.04078
	}
	cPowerFP
	{
		key = 0.00	0.03753
		key = 0.05	0.03888
		key = 0.10	0.04006
		key = 0.15	0.04104
		key = 0.20	0.04177
		key = 0.25	0.04216
		key = 0.30	0.04212
		key = 0.35	0.04173
		key = 0.40	0.04096
		key = 0.45	0.03977
		key = 0.50	0.03812
		key = 0.55	0.03599
		key = 0.60	0.03334
		key = 0.65	0.03015
		key = 0.70	0.02639
		key = 0.75	0.02206
		key = 0.80	0.01712
		key = 0.85	0.01157
		key = 0.90	0.00539
		key = 0.95	-0.00144
		key = 1.00	-0.00892
		key = 1.05	-0.01707
		key = 1.10	-0.02560
		key = 1.15	-0.03417
		key = 1.20	-0.04279
	}
	CtMach
	{
		key = 0.00	1.0	0	0
		key = 0.85	1.0	0	0
		key = 1.05	0.8	0	0
	}
	CpMach
	{
		key = 0.00	1.0	0	0
		key = 0.85	1.0	0	0
		key = 1.05	1.8	0	0
		key = 2.00	1.4	0	0
	}
	MachDrag
	{
		key = 0.00	0.0	0	0
		key = 0.85	0.0	0	0
	}
}

// the engine on Firespitter's nose engine (its propeller and blur disc are outside FAR's geometry:
// FARPartModuleTransformExceptions); its own LiquidFuel and IntakeAir
+PART[FSnoseEngine]:NEEDS[AJE]:AFTER[AJE]
{
	@name = FARTest_O320E2D
	@title = Lycoming O-320-E2D (FAR test)
	@description = 150 hp at 2700 rpm on a McCauley 1A175/ATM8042 80 x 42 seaplane propeller: the Cessna 172M floatplane's powerplant, for FAR's water tests.
	@mass = 0.130
	%rescaleFactor = 1.0
	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJEPropeller
		%useOxygen = True
		%useInHg = False
		%useHP = False
		%displacement = 320
		%compression = 7.0
		%minRPM = 600
		%maxRPM = 2700
		%power = 150
		%gearratio = 1
		%BSFC = 7.62E-8
		%coolerEffic = 0
		%coolerMin = -200
		%ramAir = 0
		%exhaustThrust = 0
		%meredithEffect = 0
		%boost0 = 29.921
		%rated0 = 0
		%boost1 = 0
		%rated1 = 0
		%cost1 = 0
		%switchAlt = 40000
		%turbo = false
		%wastegateMP = 29.921
		%propName = FARTest_McCauley1A175_ATM8042
	}
}

// B9 procedural wing panels that are also FAR control surfaces over the rear ctrlSurfFrac of their chord: a wing strip
// with its flap (the 172's: 30% of the chord) or aileron (25%), one lifting surface, as FAR models a plain flap. B9 sets
// their geometry as for any wing panel (it finds FARControllableSurface first and, the panel not being a B9 control
// surface, gives it the root mid-chord offset and leaves ctrlSurfFrac alone). ctrlSurfFrac is not persistent: the
// part's own config sets it.
+PART[B9_Aero_Wing_Procedural_TypeA]:NEEDS[ferramGraph]:FINAL
{
	@name = FARTest_B9_WingFlap
	@title = B9 wing panel with a FAR flap, 30% chord (FAR test)
	!MODULE[FARWingAerodynamicModel] {}
	MODULE
	{
		name = FARControllableSurface
		ctrlSurfFrac = 0.30
		maxdeflect = 20
		MAC = 4
		MidChordSweep = 0
		b_2 = 4
		TaperRatio = 1
	}
}
+PART[B9_Aero_Wing_Procedural_TypeA]:NEEDS[ferramGraph]:FINAL
{
	@name = FARTest_B9_WingAileron
	@title = B9 wing panel with a FAR aileron, 25% chord (FAR test)
	!MODULE[FARWingAerodynamicModel] {}
	MODULE
	{
		name = FARControllableSurface
		ctrlSurfFrac = 0.25
		maxdeflect = 20
		MAC = 4
		MidChordSweep = 0
		b_2 = 4
		TaperRatio = 1
	}
}
// the stabilizer strips with the elevator (crafts/c172_floatplane.py merge_tail_elevator: 31% of their area)
+PART[B9_Aero_Wing_Procedural_TypeA]:NEEDS[ferramGraph]:FINAL
{
	@name = FARTest_B9_TailElevator
	@title = B9 tail panel with a FAR elevator, 31% chord (FAR test)
	!MODULE[FARWingAerodynamicModel] {}
	MODULE
	{
		name = FARControllableSurface
		ctrlSurfFrac = 0.31
		maxdeflect = 28
		MAC = 4
		MidChordSweep = 0
		b_2 = 4
		TaperRatio = 1
	}
}
