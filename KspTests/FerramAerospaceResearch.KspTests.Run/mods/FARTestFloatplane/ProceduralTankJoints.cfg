// Procedural tanks as ship hulls and keels (Bonnie: a 70 m Spine hull with a ~200 t ballast keel inside it) need
// joints for that weight. PP's own 200-500 kN (sized for rocket tanks) let the keel snap off as the boat settles, or,
// with unbreakable joints, sag right out of the hull, the joint's stiffness following its strength. RO raises them too.
@PART[proceduralTank*]:AFTER[ProceduralParts]
{
	@breakingForce = 50000
	@breakingTorque = 50000
}
