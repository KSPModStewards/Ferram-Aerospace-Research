// Kerbal Powers Naval (BoatTests.Boat_RunBonnie): its propellers' ModuleSplashedThrust set EngineType = Naval, which
// isn't one of KSP's engine types (the module threw loading it): Electric, as its
// turbines drive it
@PART[*]:HAS[@MODULE[ModuleSplashedThrust]:HAS[#EngineType[Naval]]]:NEEDS[KerbalPowers]:FINAL
{
	@MODULE[ModuleSplashedThrust]
	{
		@EngineType = Electric
	}
}
