name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KSP_ROOT: /tmp/ksp

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/setup-ckan@1.1.1
        with:
          # Install dependencies whole, they are bundled in the zip
          ckan-filters: ""

      # Build references and the dependencies bundled in the zip
      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/install-dependencies@1.1.1
        with:
          dependency-identifiers: ModularFlightIntegrator KSPCommunityFixes KSPBurst ModuleManager

      - name: Stamp commit SHA
        run: |
          cp .github/package.config.json config.json.user
          python -m buildtools replace

      # Downloads stripped KSP assemblies, no secrets needed
      - uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          solution-file-path: FerramAerospaceResearch.sln

      - name: Package
        id: package-mod
        run: |
          archive=$(python -m buildtools package)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: FerramAerospaceResearch
          path: ${{ steps.package-mod.outputs.archive }}

  # Pushing a tag v<version>_<Name>, as config.json has them (v0.17.0.0_Maxwell), publishes this build as a GitHub
  # release, with notes listing the pull requests merged since the last one. CKAN picks the release up from there.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: config.json
          sparse-checkout-cone-mode: false

      - name: Check the tag against config.json
        id: version
        run: |
          number=$(jq -r '.variables | "\(.VersionMajor).\(.VersionMinor).\(.VersionBuild).\(.VersionRevision)"' config.json)
          name=$(jq -r '.variables.VersionName' config.json)
          if [ "$GITHUB_REF_NAME" != "v${number}_${name}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match config.json's version, v${number}_${name}"
            exit 1
          fi
          echo "title=Ferram Aerospace Research v$number \"$name\"" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: FerramAerospaceResearch
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.version.outputs.title }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TITLE"
