name: Make Test Release

# Run by hand (Actions > Make Test Release > Run workflow): master with the open pull requests labelled ready-for-testing
# merged in, then collect changes -> build -> run tests -> publish prerelease, through KspTest's workflow
# (chambem42/KspTest/.github/workflows/test-release.yml, which says how). The prerelease is tagged v<latest stable
# release, its fourth number counting the test releases>_testing (v0.17.0.3_testing: the third on 0.17.0.0), so stable
# releases end in .0 (package.yml checks config.json). Its notes list the pull requests and master's changes since the
# latest stable release.
#
# FAR's part: the build's CKAN dependencies, the version stamped (Version.cs, the AssemblyInfos, FAR.version; GitSha the
# merge's), the package unzipped as the release, and the tests' artifact as tests.yml's (ci.sh): the package's FAR and
# KSPBurst's Unity packages. The tests run on the stamped build, without coverage (the package has no .pdb files).

on:
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if nothing changed since the last test release
        type: boolean
        default: false
      dry-run:
        description: Build and test the merge, changed or not, but publish nothing (no tag, no prerelease)
        type: boolean
        default: false

# one test release at a time, the newest
concurrency:
  group: test-release
  cancel-in-progress: true

jobs:
  release:
    uses: chambem42/KspTest/.github/workflows/test-release.yml@main
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      # the job's OIDC token, for KspTest's game broker (the game without secrets)
      id-token: write
    with:
      force: ${{ inputs.force }}
      dry-run: ${{ inputs.dry-run }}
      name: Ferram Aerospace Research
      asset: FAR
      # Version.cs keeps the fourth number in a byte
      max-revision: 255
      dependencies: ModularFlightIntegrator KSPCommunityFixes KSPBurst ModuleManager
      solution: FerramAerospaceResearch.sln
      # config.json's replacements with the version numbers overridden, all four (master's config.json is ahead of the
      # last stable release between a release bump's merge and its tag). A config.json.user list replaces config.json's,
      # so CI's settings come after, for the package; then GitSha, logged at startup, the merge commit's
      stamp: |
        numbers=$(jq -Rc 'split(".") | map(tonumber) | {VersionMajor: .[0], VersionMinor: .[1], VersionBuild: .[2], VersionRevision: .[3]}' <<< "$TEST_RELEASE_VERSION")
        jq -n --argjson v "$numbers" '{variables: $v}' > config.json.user
        python -m buildtools replace
        jq --argjson v "$numbers" '.variables += $v | del(.replace)' .github/package.config.json > config.json.user
        sed -i -E "s/GitSha = (null|\"[^\"]*\")/GitSha = \"$TEST_RELEASE_COMMIT (testing)\"/" FerramAerospaceResearch.Base/Version.cs
        grep -F "GitSha = \"$TEST_RELEASE_COMMIT" FerramAerospaceResearch.Base/Version.cs
        grep -F "AssemblyVersion(\"$TEST_RELEASE_VERSION\")" FerramAerospaceResearch/Properties/AssemblyInfo.cs FerramAerospaceResearch.Base/Properties/AssemblyInfo.cs
        code=$(sed -n 's/.*const byte \(Major\|Minor\|Build\|Revision\) = \([0-9]*\);.*/\2/p' FerramAerospaceResearch.Base/Version.cs | paste -sd.)
        [ "$code" = "$TEST_RELEASE_VERSION" ] || { echo "::error::Version.cs is at $code, not $TEST_RELEASE_VERSION"; exit 1; }
        jq -e --arg v "$TEST_RELEASE_VERSION" '.VERSION | "\(.MAJOR).\(.MINOR).\(.PATCH).\(.BUILD)" == $v' GameData/FerramAerospaceResearch/FAR.version
      # the release: buildtools' package (a zip, or a folder), unpacked. The tests (ci/ in the test jobs, ci.sh): its
      # GameData/FerramAerospaceResearch, and KSPBurst's Unity packages for the unit tests
      package: |
        archive=$(python -m buildtools package)
        if [ -d "$archive" ]; then cp -r "$archive"/. "$RELEASE_DIR/"; else unzip -q "$archive" -d "$RELEASE_DIR"; fi
        far=$(find "$RELEASE_DIR" -type d -path '*GameData/FerramAerospaceResearch' | head -n 1)
        [ -n "$far" ] || { echo "::error::no GameData/FerramAerospaceResearch in $archive"; exit 1; }
        mkdir -p "$TESTS_DIR/GameData" "$TESTS_DIR/kspburst"
        cp -r "$far" "$TESTS_DIR/GameData/"
        cp "$KSP_ROOT"/GameData/000_KSPBurst/Plugins/Unity.*.dll "$TESTS_DIR/kspburst/" ||
          echo "::warning::no KSPBurst Unity packages: the unit tests that need them fail"
      test-project: KspTests/FerramAerospaceResearch.KspTests.Run
      title: FAR test release tests
      legs: '["windows", "linux"]'
      shards: 5
      prepare: bash .github/scripts/ci.sh prepare
      before: bash .github/scripts/ci.sh unit
